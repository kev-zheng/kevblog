---
layout: base
---

<div class="home homepage container">
  <div class="profile-column">
      <div class="profile-container">
          <img class="profile-picture" src="{{ page.profile_pic | default: "/assets/profile-home.jpg" }}" alt="profile picture"/>
      </div>

      <div class="bio-nav">
      <a href="{{ page.bio_nav}}">{{ page.bio_nav_desc }}</a>
      </div>
  </div>

  <div class="content-column">
    {{ content }}
  </div>
</div>
